image:
  repository: ghcr.io/bcit-tlu/hriv/hriv-backup
  tag: '' # Defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

# Exposes Chart.AppVersion as a ConfigMap so the hriv-backend chart can
# mount it and surface the deployed backup version via /api/admin/version.
# CI stamps Chart.AppVersion on every helm-publish (see the helm-publish
# step of .github/workflows/ci.yaml) so this value is automatically
# kept in sync with head builds, rc tags, and full releases — no manual
# fleet bump is ever required.
versionConfigMap:
  enabled: true
  name: hriv-backup-version
  key: version
  imageTagKey: image-tag

# Name of the backend chart Secret containing the database URI.
# Defaults to the Secret created by the backend chart.
postgresSecretName: postgres-db-credentials

# Name of a pre-existing Kubernetes Secret containing the Azure Storage connection
# string under key AZURE_STORAGE_CONNECTION_STRING. Required only when
# env.AZURE_STORAGE_CONTAINER enables Azure-backed mode. The chart never creates
# credentials. Vault-enabled Flux installs should use the Vault Secrets Operator
# target name; standalone Azure installs must precreate it.
azureSecretName: azure-storage-credentials

# Pod label used for pod affinity when sharing the backend's RWO data PVC.
# Disable colocation when the existing source-images claim is RWX so heavy backup
# reads can be scheduled away from the application pod.
colocateWithSourcePod: true
colocateWithPodLabel: hriv-backend

# Suspended server-side template for disconnect-safe manual backups. The schedule
# is intentionally impossible and is never evaluated while suspend remains true.
onDemandBackup:
  enabled: true
  schedule: '0 0 31 2 *'
  activeDeadlineSeconds: 21600
  backoffLimit: 0
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

env:
  DATA_DIR: /data
  BACKUP_CRON_SCHEDULE: '0 10 * * *'
  BACKUP_TIMEZONE: UTC
  BACKUP_MUTATION_DRAIN_SECONDS: '5'
  BACKUP_INVENTORY_TIMEOUT_SECONDS: '120'
  BACKUP_WAL_FENCE_TIMEOUT_SECONDS: '600'
  BACKUP_WAL_FENCE_POLL_SECONDS: '5'
  CNPG_CLUSTER_NAME: pg-core
  BACKUP_RETENTION_COUNT: '30'
  BACKUP_STALE_HOURS: '26'
  # Archives are staged here while they are built (and restores download and
  # extract here), then published with a same-filesystem rename. Defaults to
  # <backups volume>/.staging; override only to move staging off the backups PVC.
  # BACKUP_STAGING_DIR: /backups/.staging
  # BACKUP_MODE controls what the Python backup service archives and restores:
  # - development: DB + source images + generated tiles (for local/manual use)
  # - production:  DB + source images only; generated tiles are excluded and
  #                must be protected by Longhorn snapshots/backups or rebuilt
  #                from source images using the rebuild-tiles admin task.
  # The chart default is production; override to development for local or manual use.
  BACKUP_MODE: 'production'
  # Leave empty for local-PVC-only backup mode; no Azure Secret is then required.
  AZURE_STORAGE_CONTAINER: ''
  AZURE_BLOB_PREFIX: hriv-backups

# ── OpenTelemetry observability ─────────────────────────────
# When enabled=true, the backup Deployment renders OTEL_* env vars
# read by the OpenTelemetry Python SDK / auto-instrumentation (the
# image wraps ``backup.py`` with ``opentelemetry-instrument``).
# Disabled by default so deployments without an OTLP collector don't
# carry always-empty env vars in the pod spec.
#
# The exporter defaults below are chosen so that setting
# ``observability.openTelemetry.enabled=true`` +
# ``observability.openTelemetry.exporter.endpoint`` is sufficient to
# start shipping logs and traces. Override individual exporters to
# ``"none"`` to disable a specific signal.
observability:
  openTelemetry:
    enabled: false
    serviceName: 'hriv-backup'
    exporter:
      traces: 'otlp'
      metrics: 'none'
      logs: 'otlp'
      endpoint: ''
      protocol: 'http/protobuf'

# Vault Secrets Operator integration metadata retained for Flux compatibility.
# The operator target is created externally; this chart never renders a Secret.
# Disabled by default so standalone chart users are not required to use Vault.
# Override to true in Flux overlays (flux-fleet) for org deployments.
vault:
  enabled: false
  azureSecretPath: hriv/azure-storage

# Strong restricted-pod defaults. Operators may override these maps only when
# platform or storage evidence shows that different IDs/settings are required.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

automountServiceAccountToken: false

tmp:
  sizeLimit: 1Gi

persistence:
  # Deprecated legacy single-data-PVC keys kept for upgrade compatibility.
  data: {}
  sourceImages:
    enabled: true
    existingClaim: '' # Set to the backend source-images PVC to share /data
    # Leave empty to use the cluster default StorageClass.
    storageClass: ''
    size: 5Gi
    accessModes:
      - ReadWriteOnce
  tiles:
    enabled: true # Ignored while BACKUP_MODE=production (the chart default).
    existingClaim: '' # Set to the backend tiles PVC to share /data/tiles in development mode.
    # Leave empty to use the cluster default StorageClass.
    storageClass: ''
    size: 10Gi
    accessModes:
      - ReadWriteOnce
  backups:
    enabled: true
    # Leave empty to use the cluster default StorageClass.
    storageClass: ''
    size: 10Gi
    accessModes:
      - ReadWriteOnce

restoreTarget:
  existingClaim: ''
  mountPath: /restore-target

# Backups and restores stage on the /backups PVC (see BACKUP_STAGING_DIR), so
# pod-local ephemeral storage only holds logs and pg_dump/psql scratch. The explicit
# ephemeral-storage limit makes an unexpected /tmp fallback fail as a clear
# limit error instead of a mid-archive node-pressure eviction.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
    ephemeral-storage: 256Mi
  limits:
    cpu: '1'
    memory: 1Gi
    ephemeral-storage: 1Gi

nodeSelector: {}
tolerations: []
affinity: {}
