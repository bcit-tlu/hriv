{{- if not .Values.postgresSecretName }}
{{- fail "postgresSecretName is required — set it to the name of the K8s Secret containing the database URI (key: uri)" }}
{{- end }}
{{- $azureEnabled := ne (trim .Values.env.AZURE_STORAGE_CONTAINER) "" -}}
{{- if and $azureEnabled (not .Values.azureSecretName) }}
{{- fail "azureSecretName is required when AZURE_STORAGE_CONTAINER enables Azure backups; this chart does not create Azure credentials. Set it to a pre-existing Secret (or Vault Secrets Operator target) containing key AZURE_STORAGE_CONNECTION_STRING" }}
{{- end }}
{{- $deploymentAffinity := include "hriv-backup.deploymentAffinity" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hriv-backup.fullname" . }}
  labels:
    {{- include "hriv-backup.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "hriv-backup.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hriv-backup.selectorLabels" . | nindent 8 }}
    spec:
      {{- include "hriv-backup.podSpec" (dict "root" . "args" (list "cron")) | nindent 6 }}
      {{- with $deploymentAffinity }}
      affinity:
        {{- . | nindent 8 }}
      {{- end }}
