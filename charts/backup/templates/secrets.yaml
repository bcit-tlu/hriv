{{- if not .Values.vault.enabled -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace .Values.azureSecretName -}}
{{- $annotations := dict -}}
{{- if $existing -}}
{{- $annotations = ($existing.metadata.annotations | default dict) -}}
{{- end -}}
{{- if and $existing (eq (index $annotations "meta.helm.sh/release-name" | default "") .Release.Name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.azureSecretName }}
  labels:
    {{- include "hriv-backup.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
{{- end }}
{{- end }}
