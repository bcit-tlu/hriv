replicaCount: 1

image:
  repository: ghcr.io/bcit-tlu/hriv/hriv-backend
  # Defaults to .Chart.AppVersion; set to a specific release tag (e.g.
  # the version from `helm pull --version <ver>`) for reproducible deploys.
  tag: ''
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

env:
  SOURCE_IMAGES_DIR: /data/source_images
  TILES_DIR: /data/tiles
  EXPORT_PIGZ_THREADS: 2
  AZURE_BACKUP_PREFIX: ''

azureReadBackup:
  secretName: azure-read-backup-credentials

# Mount the ConfigMap published by the hriv-backup chart so
# ``/api/admin/version`` can surface the deployed backup version
# without a manual fleet bump per head build or release.  The backend
# reads the mounted file on every admin version request so kubelet's
# ConfigMap-volume refresh propagates new values without a pod restart.
#
# Precedence at runtime (see backend/app/routers/admin.py):
#   1. ``{mountPath}/{key}`` file contents (this ConfigMap mount)
#   2. ``BACKUP_VERSION`` env var  (legacy / local override)
#   3. ``"dev"``                   (unset fallback for local builds)
#
# Disable the mount (``enabled: false``) to fall back to the env var
# path; leave the ConfigMap name/key aligned with
# ``charts/backup/values.yaml → versionConfigMap``.
backupVersionConfigMap:
  enabled: false
  name: hriv-backup-version
  key: version
  imageTagKey: image-tag
  mountPath: /etc/hriv-versions

# Legacy literal override for the backup version.  Only consulted when
# ``backupVersionConfigMap.enabled=false`` or the mounted file is
# missing (e.g. local/dev installs without the backup chart deployed).
# Leave empty to render ``"dev"`` at runtime.
backupVersion: ''

frontendVersionConfigMap:
  enabled: false
  name: hriv-frontend-version
  key: version
  imageTagKey: image-tag
  mountPath: /etc/hriv-frontend-version

frontendVersion: ''

# ── OpenTelemetry observability ─────────────────────────────
# When enabled=true, the backend Deployment renders six OTEL_* env vars
# read by the OpenTelemetry Python SDK / auto-instrumentation (the stable
# image wraps uvicorn with ``opentelemetry-instrument``). Disabled by
# default so deployments without an OTLP collector don't carry six
# always-empty env vars in the pod spec.
#
# The exporter defaults below are chosen so that setting
# ``observability.openTelemetry.enabled=true`` +
# ``observability.openTelemetry.exporter.endpoint`` is sufficient to
# start shipping logs and traces. Override individual exporters to
# ``"none"`` to disable a specific signal.
observability:
  openTelemetry:
    enabled: false
    serviceName: 'hriv-backend'
    exporter:
      traces: 'otlp'
      metrics: 'none'
      logs: 'otlp'
      endpoint: ''
      protocol: 'http/protobuf'
    # Comma-delimited regexes passed to OTEL_PYTHON_FASTAPI_EXCLUDED_URLS.
    # Prevents Kubernetes liveness/readiness/storage probes and Prometheus
    # scrapes from flooding the trace backend with low-value spans.
    excludedUrls: 'api/health,api/health/ready,api/health/storage,api/metrics'
    # When "true", the OTEL Python SDK installs a LoggingHandler on the
    # root logger that bridges stdlib logging calls to the OTLP logs
    # exporter.  Without this, OTEL_LOGS_EXPORTER=otlp alone is not
    # enough — logs go to stdout but never reach the collector via OTLP.
    loggingAutoInstrumentation: 'true'
  # ── Prometheus ServiceMonitor ───────────────────────────────
  # When enabled, the chart renders a ServiceMonitor so kube-prometheus-stack
  # scrapes the /api/metrics endpoint for backup-status gauges. Operational
  # RED metrics are still sent via OTLP; this only covers the backup gauges.
  serviceMonitor:
    enabled: false
    interval: 60s
    scrapeTimeout: 10s

# Stable JWT signing secret shared across all Uvicorn workers.
# Leave blank to auto-generate a random value at install time.
# The chart enforces a non-empty JWT_SECRET is supplied to the backend
# (auto-generated if unset) and sets REQUIRE_JWT_SECRET=true so the pod
# refuses to start if the secret is missing at runtime.
jwtSecret: ''

# ── OpenID Connect / OAuth 2.0 authentication ───────────────
# Disabled by default so chart consumers can start with local
# email/password login (see bootstrapAdmin below). Enable and supply
# issuer + client credentials for SSO.
auth:
  openidConnect:
    enabled: false
    # Full issuer URL — backend appends /.well-known/openid-configuration.
    issuer: ''
    # Public client identifier (safe for ConfigMap; not a secret per OAuth 2.0 spec).
    clientId: ''
    # Client secret — only used when vault.enabled=false and existingSecret is empty.
    # When existingSecret is set, the chart-managed secret is not created.
    clientSecret: ''
    # Name of a pre-existing K8s Secret that contains 'client-id' and
    # 'client-secret' keys. When set, the chart does not create its own
    # OpenID Connect secret (e.g. kubectl create secret generic <name> ...).
    # Leave empty to let the chart create the secret from clientId/clientSecret.
    existingSecret: ''
    # Backend callback endpoint that the IdP redirects to after authentication.
    redirectUri: ''
    # Space-separated OAuth 2.0 scopes to request from the IdP.
    scopes: 'openid email profile'
    # JSON object mapping IdP group names to HRIV roles (admin/instructor/student).
    roleMapping: '{}'
    # Frontend URL to redirect to after successful login.
    postLoginRedirect: ''
    # Trust email from IdP without requiring email_verified claim.
    # Enable when your IdP does not emit the email_verified claim.
    trustEmail: false
    # CORS origins (comma-separated). Used as fallback redirect target when
    # postLoginRedirect is empty.
    corsOrigins: ''

# ── PostgreSQL database configuration ───────────────────────
# Set enabled=true to have the chart create an in-cluster CloudNative-PG
# Cluster resource. Set enabled=false to use an existing PostgreSQL
# instance and provide postgres.uri (or vault.enabled=true).
postgres:
  enabled: false
  # Full PostgreSQL connection URI for external-database deployments.
  # Only used when postgres.enabled=false AND vault.enabled=false.
  # Defaults to a local/dev-friendly value so `helm template` and
  # `helm lint` render without extra flags; override for real clusters.
  # Example: "postgresql://user:pass@db-host:5432/hriv"
  uri: 'postgresql://hriv:password1234@localhost:5432/hriv'
  cluster:
    instances: 1
    image: ghcr.io/cloudnative-pg/postgresql:16
    enableSuperuserAccess: true
  auth:
    database: hriv
    username: hriv
    password: password1234
  persistence:
    # Leave empty to use the cluster default StorageClass.
    storageClass: ''
    size: 5Gi

# ── Task execution mode ───────────────────────────────────────
# Rendered as TASK_EXECUTION_MODE on both the API and worker pods.
#   local    — prefer Redis/arq when available, but fall back to
#              in-process BackgroundTasks when the queue is down
#              (dev/test default; matches the historical behavior).
#   required — queue-backed work MUST run in dedicated worker pods;
#              enqueue failures return HTTP 503 instead of running
#              expensive jobs inside the API process. Rendering fails
#              unless redis.enabled=true and redis.worker.enabled=true.
tasks:
  executionMode: 'local'

# ── Redis / arq background worker ────────────────────────────
# When enabled, the chart injects REDIS_URL into the backend pod and
# optionally deploys a dedicated arq worker Deployment that processes
# image-generation and admin tasks off the main API process.
#
# Without Redis the backend gracefully degrades (in local execution
# mode only): image processing runs in-process via FastAPI
# BackgroundTasks and login rate limiting is disabled.  Enabling
# Redis adds:
#   • Job persistence — in-flight tasks survive pod restarts
#   • Resource isolation — tile generation runs in a separate worker pod
#   • Login rate limiting — brute-force protection via token bucket
redis:
  enabled: false
  # Full Redis connection URL consumed by the backend (arq + rate limiter).
  # When deploying Redis in-cluster, use the Kubernetes Service DNS name:
  #   redis://hriv-redis:6379
  url: 'redis://hriv-redis:6379'
  # Deploy a dedicated arq worker Deployment alongside the API pod.
  # Requires redis.enabled=true.  When false, background tasks fall back
  # to in-process BackgroundTasks (the existing graceful-degradation path).
  worker:
    enabled: false
    replicaCount: 1
    # Maximum concurrent arq jobs per worker pod (WORKER_MAX_JOBS,
    # minimum 2). A bulk-import coordinator occupies one slot for the
    # whole batch while it waits on its child jobs, so keep this above
    # the number of concurrent bulk imports you expect.
    maxJobs: 4
    # Cluster-wide worker-slot capacity (WORKER_TOTAL_SLOTS), used by
    # bulk-import starvation detection. Leave empty to default to
    # maxJobs at runtime — correct for a single worker replica. Set it
    # explicitly to replicas × maxJobs when running (or autoscaling to)
    # multiple worker replicas.
    totalSlots: ''
    # SQLAlchemy pool sizing for the worker process (DB_POOL_SIZE /
    # DB_MAX_OVERFLOW). The backend defaults (10/20) are sized for the
    # API; a worker running at most maxJobs jobs needs far fewer
    # connections.
    db:
      poolSize: 5
      maxOverflow: 5
    # How long Kubernetes waits after SIGTERM before force-killing the
    # worker pod. The Kubernetes default (30s) interrupts in-flight
    # tile-generation and import/export jobs on every rollout; 300s
    # gives short jobs a chance to drain.
    terminationGracePeriodSeconds: 300
    # ── Worker liveness probe ─────────────────────────────────
    # Execs `arq --check`, which verifies the arq health key in Redis
    # is fresh, so a wedged worker main loop is restarted instead of
    # sitting idle while the queue grows. The health key is shared per
    # queue, so with multiple replicas the probe only detects the case
    # where every worker stopped heartbeating; the generous
    # failureThreshold also tolerates brief Redis outages without
    # restarting workers mid-job.
    probes:
      liveness:
        enabled: true
        initialDelaySeconds: 60
        periodSeconds: 60
        timeoutSeconds: 15
        failureThreshold: 10
    resources:
      requests:
        memory: '512Mi'
        cpu: '250m'
        ephemeral-storage: '256Mi'
      limits:
        memory: '4Gi'
        cpu: '2'
        ephemeral-storage: '1Gi'
    # ── Worker Horizontal Pod Autoscaler ──────────────────────
    # Scales worker replicas based on CPU/memory utilisation so that
    # concurrent image-processing jobs are distributed across pods.
    # Each worker handles maxJobs (default 4) tasks, so 3 replicas =
    # 12 parallel processing slots. Remember to set totalSlots when
    # autoscaling above one replica.
    #
    # Prerequisites:
    #   - Kubernetes Metrics Server must be running
    #   - PVC must be ReadWriteMany when minReplicas > 1 (or use an
    #     RWX-capable StorageClass)
    #
    # Queue depth is exported as hriv_task_queue_depth for
    # observability and alerting; it is not used as a scaling signal.
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 5
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 80

# ── Feedback delivery ────────────────────────────────────────
# The backend accepts in-app feedback submissions via
# POST /api/issues/report, then routes them through a provider.
#
# Supported providers:
#   - "" / disabled
#   - email
#   - teams
#
# To enable email delivery, create a secret with the SMTP credentials:
#   kubectl create secret generic hriv-feedback-email \
#     --from-literal=smtp_server=smtp.example.com \
#     --from-literal=smtp_port=587 \
#     --from-literal=username=hriv-feedback \
#     --from-literal=password=YOUR_PASSWORD -n <namespace>
#
# Then set:
#   feedback:
#     provider: email
#     email:
#       existingSecret: hriv-feedback-email
#       to: tlu_techops@bcit.ca
#       from: hriv-feedback@example.com
#
# To enable Teams delivery with a channel webhook:
#   kubectl create secret generic hriv-feedback-teams-webhook \
#     --from-literal=url=https://outlook.office.com/webhook/... -n <namespace>
#
# Then set:
#   feedback:
#     provider: teams
#     teams:
#       webhook:
#         existingSecret: hriv-feedback-teams-webhook
feedback:
  provider: ''
  email:
    existingSecret: ''
    to: ''
    from: ''
    smtpSecurity: ''
  teams:
    webhook:
      existingSecret: ''

# Vault / external secret-management toggle.
vault:
  enabled: false

# ── NetworkPolicy ─────────────────────────────────────────────
# Restricts ingress to the API pods so only the frontend proxy and the
# metrics scraper can reach the backend Service. This is the enforcement
# layer that makes the "cluster-internal" /api/metrics route real (the
# frontend nginx already 404s it at the edge; without this policy any
# in-cluster client can read it) — see docs/unauthenticated-routes.md
# (added in PR #1151).
# Disabled by default because the peer selectors are cluster-specific;
# enable it in the deployment overlay. Kubelet probes are unaffected.
networkPolicy:
  enabled: false
  # Pods allowed to reach the API port (and the tiles sidecar port when
  # tiles.enabled): the frontend proxy.
  frontend:
    podSelector:
      matchLabels:
        app.kubernetes.io/name: hriv-frontend
    # Set when the frontend runs in another namespace, e.g.
    #   matchLabels: { kubernetes.io/metadata.name: hriv-frontend-ns }
    # Empty = same namespace only.
    namespaceSelector: {}
  # Prometheus scrapes /api/metrics directly from the pods (see
  # observability.serviceMonitor). NOTE: NetworkPolicy cannot filter by
  # HTTP path, so any pod matched here can reach every backend endpoint —
  # keep the selection as narrow as possible. The default matches only
  # Prometheus pods (kube-prometheus-stack labels) in the monitoring
  # namespace; adjust both selectors to your cluster.
  metricsScraper:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: monitoring
    podSelector:
      matchLabels:
        app.kubernetes.io/name: prometheus
  # Additional raw NetworkPolicy ingress rules appended verbatim.
  extraIngress: []

# Nginx sidecar for serving /api/tiles directly from the PVC,
# bypassing the Python process.  Tiles are immutable and cache-friendly.
tiles:
  enabled: false
  nginx:
    image: nginx:1.27-alpine
    port: 8001
    resources: {}

persistence:
  enabled: false
  # Deprecated legacy single-PVC keys kept for upgrade compatibility.
  # When set, templates use them as source-images defaults unless the
  # new nested keys are explicitly changed from their chart defaults.
  storageClass: ''
  size: ''
  accessModes: []
  # The source-images PVC remains mounted at /data so the backend can
  # continue using /data/.maintenance and /data/admin_tasks while
  # preserving SOURCE_IMAGES_DIR=/data/source_images.
  sourceImages:
    existingClaim: ''
    # Leave empty to use the cluster default StorageClass.
    storageClass: ''
    size: 10Gi
    # ReadWriteOnce is fine for single-replica dev/staging.
    # Production with redis.worker.enabled=true or replicaCount > 1
    # MUST use ReadWriteMany so the API pod and worker pod(s) can all
    # access uploaded source images plus shared /data task state.
    accessModes:
      - ReadWriteOnce
  tiles:
    existingClaim: ''
    # Leave empty to use the cluster default StorageClass.
    storageClass: ''
    size: 10Gi
    # Generated tiles must also be RWX when shared across multiple API
    # or worker replicas.
    accessModes:
      - ReadWriteOnce

resources: {}

# ── Pod health probes ───────────────────────────────────────
# Defaults are intentionally conservative so transient DB or node I/O
# pressure does not evict a healthy backend pod. The readiness probe
# checks /api/health/ready (database + storage), while the liveness probe
# checks /api/health/storage so Kubernetes restarts the pod when the
# source-images volume becomes read-only.
probes:
  backend:
    liveness:
      path: /api/health/storage
      initialDelaySeconds: 10
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 6
    readiness:
      path: /api/health/ready
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3

# ── High-availability / topology spreading ────────────────────
# When enabled, adds a required pod anti-affinity rule so that no two
# backend replicas land in the same topology zone (e.g. datacenter).
# Requires nodes to be labeled with the chosen topologyKey.
#   kubectl label node <name> topology.kubernetes.io/zone=dtc
#   kubectl label node <name> topology.kubernetes.io/zone=bby
scheduling:
  zoneAntiAffinity:
    enabled: false
    topologyKey: topology.kubernetes.io/zone

# Explicit override for the Deployment `.spec.strategy`. Leave empty to let
# the chart auto-select: Recreate for RWO PVCs, RollingUpdate with
# maxSurge: 0/maxUnavailable: 1 for hard zone anti-affinity and replicaCount > 1,
# otherwise Kubernetes defaults.
updateStrategy: {}

nodeSelector: {}
tolerations: []
affinity: {}

# ── Initial admin seed (post-install hook) ───────────────────
# When enabled=true, Helm renders a one-shot post-install Job
# (``templates/job-seed-admin.yaml``) that inserts a single admin
# user + bootstrap program on the very first install (``helm.sh/hook:
# post-install`` — not re-run on upgrades or rollbacks).
#
# Enabled by default so fresh ``helm install`` runs produce a working
# local admin login even when OpenID Connect isn't wired up yet. Without this
# seed (and without OpenID Connect), there is no initial user and no way to
# create one through the API (POST /api/users requires admin role).
#
# The default ``passwordHash`` is the same development hash used by
# ``db/seed.sql`` in docker-compose; the operator's very first task
# after the pods are healthy should be to log in as this account and
# rotate the password via the normal change-password flow (or disable
# the account once real admins are created through OpenID Connect).
#
# Set ``bootstrapAdmin.enabled: false`` to skip the Job entirely for
# deployments that rely exclusively on OpenID Connect from day one (see
# ``auth.openidConnect.roleMapping`` above).
bootstrapAdmin:
  enabled: true
  name: 'Haruki Tanaka'
  email: 'admin@example.ca'
  # bcrypt hash of the bootstrap password.  Defaults to the same
  # development hash shared by docker-compose seed users (intended
  # to be rotated immediately after first login).  Override with
  # ``--set bootstrapAdmin.passwordHash=...`` or in a values file for a
  # stronger initial password.
  # Generate a new hash with:
  #   python -c "import bcrypt; print(bcrypt.hashpw(b'<password>', bcrypt.gensalt()).decode())"
  # Setting this to an empty string while ``enabled: true`` makes
  # ``helm install`` fail loudly at render time rather than silently
  # inserting an unusable empty hash.
  passwordHash: '$2b$12$bD0vGhiySbmr6aqbp.fjeuF9VTVMaGiKOujX2aOoTIRxyjsNc4b2C'
