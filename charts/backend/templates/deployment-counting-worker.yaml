{{- $tiles := include "hriv-backend.resolvedTilesPersistence" . | fromYaml -}}
{{- $tilesAccessModes := get $tiles "accessModes" -}}
{{- $probes := .Values.countingWorker.probes | default dict -}}
{{- $liveness := get $probes "liveness" | default dict -}}
{{- if and .Values.countingWorker.enabled (not .Values.redis.enabled) }}
{{- fail "countingWorker.enabled requires redis.enabled — the counting worker needs a Redis connection" }}
{{- end }}
{{- if and .Values.countingWorker.enabled (not .Values.persistence.enabled) }}
{{- fail "countingWorker.enabled requires persistence.enabled — the counting worker mounts the tiles PVC read-only" }}
{{- end }}
{{- if and .Values.countingWorker.enabled .Values.persistence.enabled (not (has "ReadWriteMany" $tilesAccessModes)) }}
{{- fail "countingWorker.enabled with persistence requires a ReadWriteMany tiles PVC — the counting worker mounts /data/tiles" }}
{{- end }}
{{- if .Values.countingWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hriv-backend.fullname" . }}-counting-worker
  labels:
    {{- include "hriv-backend.labels" . | nindent 4 }}
    app.kubernetes.io/component: counting-worker
spec:
  {{- if not .Values.countingWorker.autoscaling.enabled }}
  replicas: {{ .Values.countingWorker.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "hriv-backend.name" . }}-counting-worker
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "hriv-backend.name" . }}-counting-worker
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: counting-worker
    spec:
      terminationGracePeriodSeconds: {{ .Values.countingWorker.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: counting-worker
          image: "{{ .Values.countingWorker.image.repository }}:{{ .Values.countingWorker.image.tag | default (.Values.image.tag | default .Chart.AppVersion) }}"
          imagePullPolicy: {{ .Values.countingWorker.image.pullPolicy }}
          command: ["opentelemetry-instrument", "arq", "app.counting.worker.CountingWorkerSettings"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
          env:
            - name: COUNTING_ENABLED
              value: {{ .Values.counting.enabled | quote }}
            - name: COUNTING_QUEUE_NAME
              value: {{ .Values.counting.queueName | quote }}
            - name: COUNTING_MAX_PIXELS
              value: {{ .Values.counting.maxPixels | quote }}
            - name: COUNTING_CLASSICAL_MAX_PIXELS
              value: {{ .Values.counting.classicalMaxPixels | quote }}
            - name: COUNTING_MAX_DOWNSAMPLE
              value: {{ .Values.counting.maxDownsample | quote }}
            - name: COUNTING_MARGIN_PX
              value: {{ .Values.counting.marginPx | quote }}
            - name: COUNTING_MAX_ACTIVE_PER_USER
              value: {{ .Values.counting.maxActivePerUser | quote }}
            - name: COUNTING_RESULT_TTL_SECONDS
              value: {{ .Values.counting.resultTtlSeconds | quote }}
            - name: COUNTING_JOB_TIMEOUT_SECONDS
              value: {{ .Values.counting.jobTimeoutSeconds | quote }}
            - name: COUNTING_MAX_OBJECTS
              value: {{ .Values.counting.maxObjects | quote }}
            - name: COUNTING_TORCH_THREADS
              value: {{ .Values.countingWorker.torchThreads | quote }}
            - name: COUNTING_CELLS_OUTLINER
              value: {{ .Values.countingWorker.cellsOutliner | quote }}
            - name: COUNTING_NUCLEI_OUTLINER
              value: {{ .Values.countingWorker.nucleiOutliner | quote }}
            - name: REDIS_URL
              value: {{ .Values.redis.url | quote }}
            - name: TILES_DIR
              value: {{ .Values.env.TILES_DIR | quote }}
            - name: APP_VERSION
              value: {{ include "hriv-backend.displayVersion" . | quote }}
            - name: APP_IMAGE_TAG
              value: {{ .Values.countingWorker.image.tag | default (.Values.image.tag | default .Chart.AppVersion) | quote }}
            - name: WORKER_VERSION
              value: {{ include "hriv-backend.displayVersion" . | quote }}
            - name: WORKER_IMAGE_TAG
              value: {{ .Values.countingWorker.image.tag | default (.Values.image.tag | default .Chart.AppVersion) | quote }}
            {{- if .Values.observability.openTelemetry.enabled }}
            - name: OTEL_SERVICE_NAME
              value: {{ printf "%s-counting-worker" .Values.observability.openTelemetry.serviceName | quote }}
            - name: OTEL_TRACES_EXPORTER
              value: {{ .Values.observability.openTelemetry.exporter.traces | quote }}
            - name: OTEL_METRICS_EXPORTER
              value: {{ .Values.observability.openTelemetry.exporter.metrics | quote }}
            - name: OTEL_LOGS_EXPORTER
              value: {{ .Values.observability.openTelemetry.exporter.logs | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.observability.openTelemetry.exporter.endpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ .Values.observability.openTelemetry.exporter.protocol | quote }}
            - name: OTEL_PYTHON_DISABLED_INSTRUMENTATIONS
              value: "redis"
            - name: OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED
              value: {{ .Values.observability.openTelemetry.loggingAutoInstrumentation | quote }}
            {{- end }}
          {{- if get $liveness "enabled" | default false }}
          livenessProbe:
            exec:
              command: ["arq", "--check", "app.counting.worker.CountingWorkerSettings"]
            initialDelaySeconds: {{ get $liveness "initialDelaySeconds" | default 60 }}
            periodSeconds: {{ get $liveness "periodSeconds" | default 60 }}
            timeoutSeconds: {{ get $liveness "timeoutSeconds" | default 15 }}
            failureThreshold: {{ get $liveness "failureThreshold" | default 10 }}
          {{- end }}
          {{- with .Values.countingWorker.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tiles-data
              mountPath: /data/tiles
              readOnly: true
      volumes:
        - name: tiles-data
          persistentVolumeClaim:
            claimName: {{ get $tiles "existingClaim" | default (printf "%s-tiles" (include "hriv-backend.fullname" .)) }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
