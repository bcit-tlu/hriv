apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hriv-restore-validation-orchestrator
  labels:
    {{- include "hriv-restore-validation.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [hriv-restore-validation-state]
    verbs: [get, patch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [hriv-restore-validation]
    verbs: [get, patch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, list, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, delete]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [create, get, list, delete]
  # CNPG creates run-scoped Services; the controller observes and cleans only UID/label-bound children.
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, delete]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters]
    verbs: [create, get, list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hriv-restore-validation-orchestrator
  labels:
    {{- include "hriv-restore-validation.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: hriv-restore-validation-orchestrator
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hriv-restore-validation-orchestrator
