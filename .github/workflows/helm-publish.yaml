name: helm-publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to package and publish (e.g. frontend-v1.2.3)'
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [frontend, backend, backup, restore-validation]

    steps:
      - name: Parse release tag
        id: parse
        shell: bash
        env:
          TAG: ${{ inputs.tag_name || github.event.release.tag_name }}
        run: |
          if [[ "$TAG" =~ ^${{ matrix.component }}-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.parse.outputs.publish == 'true'

      - uses: azure/setup-helm@v5
        if: steps.parse.outputs.publish == 'true'
        with:
          version: v4.3.0

      - uses: sigstore/cosign-installer@v3
        if: steps.parse.outputs.publish == 'true'

      - name: Cosign login (OCI)
        if: steps.parse.outputs.publish == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY: ${{ env.REGISTRY }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "${GITHUB_TOKEN}" | \
            cosign login "${REGISTRY}" \
            -u "${ACTOR}" \
            --password-stdin

      - uses: docker/login-action@v4
        if: steps.parse.outputs.publish == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Flux upgrades the HelmRelease as soon as the chart lands, with the
      # chart's appVersion as the image tag. release-retag.yaml aliases that
      # tag a few minutes later, so publishing first leaves the new pods in
      # ImagePullBackOff until the Helm timeout fires and Flux rolls back —
      # which the backend cannot survive (forward-only migrations). Wait for
      # every image this chart pulls before pushing it.
      - name: Wait for release images
        if: steps.parse.outputs.publish == 'true'
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
          VERSION: ${{ steps.parse.outputs.version }}
          REPO: ${{ env.REGISTRY }}/${{ github.repository }}
        run: |
          set -euo pipefail
          IMAGES="hriv-${COMPONENT}"
          # The counting worker shares the backend release tag (ci.yaml
          # tag_prefix backend-v) but is a separate image — and releases cut
          # before it existed never built one (release-retag.yaml skips it
          # the same way), so republishing those must not wait for it.
          if [[ "${COMPONENT}" == "backend" ]] \
            && grep -q 'AS counting-worker' backend/Dockerfile; then
            IMAGES="${IMAGES} hriv-counting-worker"
          fi
          # Same backoff as release-retag.yaml's "Wait for source image".
          DEADLINE=$(( $(date +%s) + 1800 ))
          for NAME in ${IMAGES}; do
            REF="${REPO}/${NAME}:${VERSION}"
            DELAY=10
            while ! docker buildx imagetools inspect "${REF}" >/dev/null 2>&1; do
              if [[ $(date +%s) -ge $DEADLINE ]]; then
                echo "::error::Timed out after 30m waiting for ${REF}" \
                  "(release-retag.yaml did not alias it); chart not published."
                exit 1
              fi
              echo "${REF} not yet available; retrying in ${DELAY}s..."
              sleep "$DELAY"
              DELAY=$(( DELAY * 2 )); (( DELAY > 60 )) && DELAY=60
            done
            echo "${REF} is available."
          done

      - name: Helm login (OCI)
        if: steps.parse.outputs.publish == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY: ${{ env.REGISTRY }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "${GITHUB_TOKEN}" | \
            helm registry login "${REGISTRY}" \
            -u "${ACTOR}" \
            --password-stdin

      - name: Package and push chart
        id: push
        if: steps.parse.outputs.publish == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.parse.outputs.version }}
          CHART_DIR: charts/${{ matrix.component }}
          OCI_REPO: oci://${{ env.REGISTRY }}/${{ github.repository }}/charts
        run: |
          set -euo pipefail

          CHART_NAME=$(yq '.name' "${CHART_DIR}/Chart.yaml")
          DEST_DIR="/tmp/charts"
          mkdir -p "${DEST_DIR}"

          helm dependency update "${CHART_DIR}" || true

          helm package "${CHART_DIR}" \
            --version "${VERSION}" \
            --app-version "${VERSION}" \
            -d "${DEST_DIR}"

          PUSH_OUT=$(helm push \
            "${DEST_DIR}/${CHART_NAME}-${VERSION}.tgz" \
            "${OCI_REPO}" 2>&1) || { echo "${PUSH_OUT}"; exit 1; }
          echo "${PUSH_OUT}"

          # Tolerant digest parse: case-insensitive, allows leading whitespace.
          DIGEST=$(printf '%s\n' "${PUSH_OUT}" \
            | awk 'tolower($1)=="digest:"{print $2; exit}')
          if [[ -z "${DIGEST}" ]]; then
            echo "::error::helm push succeeded but no digest found in output"
            exit 1
          fi

          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "chart_name=${CHART_NAME}" >> "$GITHUB_OUTPUT"

      - name: Sign chart
        if: steps.parse.outputs.publish == 'true' && steps.push.outputs.digest != ''
        env:
          CHART_REF: ${{ env.REGISTRY }}/${{ github.repository }}/charts/${{ steps.push.outputs.chart_name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "${CHART_REF}@${DIGEST}"
