name: Chromatic

on:
  # Chromatic recommends push events so branch baselines are associated with
  # commits that actually exist in the repository rather than ephemeral PR
  # merge commits.
  push:
    paths:
      - 'frontend/**'
  # pull_request events enable Chromatic patch builds that compare the PR
  # branch against the base branch, powering UI Review on pull requests.
  pull_request:
    paths:
      - 'frontend/**'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  chromatic:
    name: Run Chromatic visual tests
    runs-on: ubuntu-latest
    # Skip for fork PRs: GitHub does not expose repository secrets to
    # pull requests from forks, so CHROMATIC_PROJECT_TOKEN is empty.
    # Push and workflow_dispatch events are unaffected (the fork check
    # only evaluates true for pull_request events from external repos).
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.fork == false && github.actor != 'dependabot[bot]'
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Publish Storybook to Chromatic
        uses: chromaui/action@v18.7.1
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: frontend
          buildScriptName: build-storybook
