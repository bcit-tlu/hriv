name: Chromatic

on:
  # Chromatic recommends push events so branch baselines are associated with
  # commits that actually exist in the repository rather than ephemeral PR
  # merge commits.  The pull_request event creates ephemeral merge commits
  # that can cause incorrect baseline comparisons.
  #
  # The paths filter below preserves that baseline chain while skipping pushes
  # that cannot change rendered output: it excludes only the mechanical files
  # that every release-please or dependency merge touches. Those diffs
  # previously forced full rebuilds (TurboSnap cannot prove a package file
  # change is version-only) and were the main driver of quota exhaustion.
  # Every other frontend change still builds on every branch, so stacked PRs
  # keep real base baselines; a base branch with no frontend changes falls
  # back to an ancestor build whose frontend content is identical anyway.
  #
  # release-please--* branches are exempt: they are bot-owned version/changelog
  # bumps, never carry story changes, and are never UI Review targets.
  # (branches-ignore also scopes the trigger to branch pushes, so tag pushes
  # do not run either.)
  #
  # Kill switch: the job-level `if` skips all runs when the CHROMATIC_ENABLED
  # repository variable is 'false' — flip it in Settings → Variables when the
  # monthly quota is exhausted instead of editing this file. Unset or any
  # other value leaves builds enabled. dependabot[bot] is also skipped there
  # because its pushes receive no repository secrets.
  #
  # The weekly schedule catches rendering drift from dependency merges that
  # the paths filter skips — one bounded build per week instead of a full
  # rebuild per merge.
  push:
    branches-ignore:
      - 'release-please--**'
    paths:
      - 'frontend/**'
      - '!frontend/package.json'
      - '!frontend/package-lock.json'
      - '!frontend/CHANGELOG.md'
      - '!frontend/public/THIRD-PARTY-LICENSES.txt'
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 0'

concurrency:
  # Rapid pushes to the same branch supersede the in-flight build. Scoped per
  # ref so runs on other branches continue independently.
  group: chromatic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  chromatic:
    name: Run Chromatic visual tests
    if: github.actor != 'dependabot[bot]' && vars.CHROMATIC_ENABLED != 'false'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Publish Storybook to Chromatic
        uses: chromaui/action@v18.9.5
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: frontend
          buildScriptName: build-storybook
          autoAcceptChanges: 'main'
