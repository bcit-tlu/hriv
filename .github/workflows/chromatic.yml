name: Chromatic

on:
  # Chromatic recommends push events so branch baselines are associated with
  # commits that actually exist in the repository rather than ephemeral PR
  # merge commits.  The pull_request event creates ephemeral merge commits
  # that can cause incorrect baseline comparisons.
  #
  # Do NOT add a paths filter here: Chromatic needs a build for every commit
  # on every branch so UI Review always has a baseline on the target branch.
  # Skipping commits via path filtering breaks the baseline chain and forces
  # manual patch builds (see chromatic.com/docs/github-actions).
  push:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  chromatic:
    name: Run Chromatic visual tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Publish Storybook to Chromatic
        uses: chromaui/action@v18.7.1
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: frontend
          buildScriptName: build-storybook
          autoAcceptChanges: 'main'
