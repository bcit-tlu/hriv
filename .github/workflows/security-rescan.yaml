name: '[Security] Weekly Trivy rescan of published images'

# The reusable oci-build workflow only scans an image when its component
# changes, so new CVEs in an unchanged image never reach code scanning. This
# workflow rescans the published `latest` (released) images on a schedule and
# uploads SARIF under `trivy-<component>-released`. oci-build uploads the
# main rc image under `trivy-<component>`; `latest` is the last release's
# digest, so the two are kept in separate categories rather than overwriting
# each other's alert set whenever main is ahead of the last release.
#
# Scan-only: nothing is rebuilt or pushed (a rebuild would retag `latest` and
# roll the staging environment on a timer).

on:
  schedule:
    # Mondays 14:00 UTC. Dependabot runs at 05:00 America/Vancouver (12:00 or
    # 13:00 UTC), so its PRs are open before this scan reports.
    - cron: '0 14 * * 1'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  rescan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # pull private GHCR images
      security-events: write # upload SARIF
      actions: read # required by codeql-action/upload-sarif on private repos
    strategy:
      fail-fast: false
      matrix:
        component: [frontend, backend, backup, restore-validation, synthetic-monitoring]
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .trivyignore
          sparse-checkout-cone-mode: false

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan image (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}/hriv-${{ matrix.component }}:latest
          format: sarif
          output: trivy-${{ matrix.component }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          trivyignores: .trivyignore
          exit-code: '0'

      - name: Upload scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.component }}.sarif
          category: trivy-${{ matrix.component }}-released
