[tool.poetry]
name = "hriv-restore-validation"
version = "0.2.2"
description = "Isolated HRIV restore-validation controller"
authors = ["BCIT TLU"]
license = "MPL-2.0"
packages = [{include = "hriv_restore_validation"}]

[tool.poetry.dependencies]
python = "^3.15"
kubernetes = "36.0.3"
PyYAML = "6.0.3"
opentelemetry-distro = "0.57b0"
opentelemetry-exporter-otlp = "1.36.0"
grpcio = ">=1.85.3,<2"
psycopg = {version = "3.3.9", extras = ["binary"]}

[tool.poetry.group.dev.dependencies]
coverage = "7.17.3"

[tool.poetry.scripts]
hriv-restore-validation = "hriv_restore_validation.cli:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
