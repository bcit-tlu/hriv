[tool.poetry]
name = "hriv-backend"
version = "0.64.3"
description = "HRIV Image Library API"
authors = ["Devin AI"]
license = "MPL-2.0"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = ">=0.136,<0.142"
uvicorn = {extras = ["standard"], version = ">=0.34,<0.55"}
sqlalchemy = {version = "^2.0.0", extras = ["asyncio"]}
asyncpg = ">=0.30,<0.32"
pydantic = "^2.0.0"
pydantic-settings = "^2.0.0"
python-multipart = ">=0.0.22,<0.0.33"
pyjwt = "^2.15.0"
bcrypt = "^5.0.0"
httpx = "^0.28.0"
pyvips = ">=3.2.0,<4.0"
authlib = "^1.3.0"
itsdangerous = ">=1.1.0"
arq = ">=0.27,<0.29"
redis = "^5.0.0"
opentelemetry-distro = "^0.64b0"
opentelemetry-exporter-otlp = "^1.36.0"
opentelemetry-instrumentation-fastapi = "^0.64b0"
opentelemetry-instrumentation-httpx = "^0.64b0"
opentelemetry-instrumentation-sqlalchemy = "^0.64b0"
opentelemetry-instrumentation-redis = "^0.64b0"
alembic = "^1.13.0"
azure-storage-blob = "12.30.3"
prometheus-client = ">=0.21,<0.27"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.3,<10.0.0"
pytest-asyncio = ">=0.24,<1.5"
pytest-cov = ">=7.1.0,<8"
fakeredis = "2.38.0"
lupa = "^2.8"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
